general {
    lock_cmd = pidof hyprlock || hyprlock       # don't launch a second hyprlock if one's already running
    before_sleep_cmd = loginctl lock-session    # lock before the system actually suspends
    after_sleep_cmd = hyprctl dispatch dpms on  # wake the display immediately on resume
    inhibit_sleep = 3                            # wait until hyprlock has actually locked before letting suspend proceed
}

# Lock screen after 3 minutes
listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

# Turn off screen after 5 minutes
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 min
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

