# ── Theme ────────────────────────────────────────────────────────────────────
$font       = JetBrainsMono Nerd Font
$text       = rgba(205, 214, 244, 1.0)
$text_dim   = rgba(205, 214, 244, 0.6)
$accent     = rgba(137, 180, 250, 1.0)
$surface    = rgba(30, 30, 46, 0.6)
$error      = rgba(243, 139, 168, 1.0)
$success    = rgba(166, 227, 161, 1.0)
 
# ── General ──────────────────────────────────────────────────────────────────
general {
    hide_cursor        = true
    ignore_empty_input = true
}
 
# ── Background: blurred screenshot of the current desktop ────────────────────
background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 8
    brightness  = 0.6
    noise       = 0.01
}
 
# ── Clock ────────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M:%S"
    color       = $text
    font_size   = 96
    font_family = $font
    position    = 0, 180
    halign      = center
    valign      = center
}
 
# ── Date ─────────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d %B"
    color       = $text_dim
    font_size   = 20
    font_family = $font
    position    = 0, 90
    halign      = center
    valign      = center
}
 
# ── Password input ───────────────────────────────────────────────────────────
input-field {
    monitor            =
    size               = 300, 50
    position           = 0, -90
    halign             = center
    valign             = center
 
    rounding           = 12
    outline_thickness  = 2
    outer_color        = $accent
    inner_color        = $surface
    font_color         = $text
    font_family        = $font
 
    check_color        = $success
    fail_color         = $error
    fail_text          = <i>$FAIL ($ATTEMPTS)</i>
 
    dots_size          = 0.25
    dots_spacing       = 0.3
    dots_center        = true
    fade_on_empty      = true
    placeholder_text   = Password…
}
